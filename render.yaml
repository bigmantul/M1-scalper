# Render Blueprint — optional. Lets you create the service from the repo with one click
# (Dashboard → New → Blueprint). Secrets are NOT stored here; Render asks you for them.
services:
  - type: web
    name: m1-scalper
    runtime: node
    plan: starter            # always-on + persistent disk. Free instances sleep and have no disk.
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false        # deploy by hand, when the bot is flat
    disk:
      name: scalper-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: DERIV_PAT_TOKEN
        sync: false
      - key: DERIV_APP_ID
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
